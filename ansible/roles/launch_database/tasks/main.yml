- name: Launch database container
  community.docker.docker_container:
    name: database
    image: emilez10/tp-devops-database:latest
    networks:
      - name: my-network
    env:
      POSTGRES_DB: "db"
      POSTGRES_USER: "usr"
      POSTGRES_PASSWORD: "pwd"
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
