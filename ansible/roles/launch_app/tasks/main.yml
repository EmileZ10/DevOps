- name: Launch app container
  community.docker.docker_container:
    name: backend
    image: emilez10/tp-devops-simple-api:latest
    networks:
      - name: my-network
    env:
      POSTGRES_DB: "db"
      POSTGRES_USER: "usr"
      POSTGRES_PASSWORD: "pwd"
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
