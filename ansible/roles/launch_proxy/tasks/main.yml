- name: Launch proxy container
  community.docker.docker_container:
    name: my-httpd
    image: emilez10/tp-devops-httpd:latest
    networks:
      - name: my-network
    ports:
      - "80:80"
    env:
      BACKEND_HOST: "backend"
      BACKEND_PORT: "8080"
  vars:
    ansible_python_interpreter: /opt/docker_venv/bin/python
